name: Build image assets

on:
  push:
    paths:
      - 'incoming/*.b64'
      - 'images/*.svg'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin

      - name: Decode incoming images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          shopt -s nullglob
          files=(incoming/*.b64)
          for payload in "${files[@]}"; do
            name="$(basename "$payload" .b64)"
            if base64 -d "$payload" > "images/$name"; then
              rm -f "$payload"
            else
              rm -f "images/$name"
              echo "Skipping invalid base64 payload: $payload"
            fi
          done

      - name: Convert SVG eyecatches to WebP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          svgs=(images/*.svg)
          for svg in "${svgs[@]}"; do
            out="${svg%.svg}.webp"
            rsvg-convert -w 1200 -h 630 "$svg" -o /tmp/eyecatch.png
            convert /tmp/eyecatch.png -quality 82 "$out"
          done

      - name: Commit built images
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "shigoto-help-image-bridge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add images incoming
          git commit -m "Build image assets"
          git push
