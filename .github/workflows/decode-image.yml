name: Decode image payload

on:
  push:
    paths:
      - 'incoming/*.b64'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode incoming images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          shopt -s nullglob
          files=(incoming/*.b64)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No payload files found."
            exit 0
          fi
          for payload in "${files[@]}"; do
            name="$(basename "$payload" .b64)"
            base64 -d "$payload" > "images/$name"
            rm -f "$payload"
          done

      - name: Commit decoded images
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "shigoto-help-image-bridge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add images incoming
          git commit -m "Decode image payload"
          git push
